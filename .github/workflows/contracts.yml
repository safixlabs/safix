name: contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install slither-analyzer
      # Fails on a high finding only. The mediums that stand today are triaged in
      # contracts/AUDIT.md with the reason each was left; failing on them would
      # mean either changing arithmetic that is correct or silencing the detector,
      # and both cost more than they buy. A new high finding stops the build.
      - name: Static analysis
        working-directory: contracts
        run: slither . --filter-paths "lib|test|script|Mock" --fail-high

  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The memorandum states a test count and a deployment status; both are
      # measurable from this repository, so they are measured rather than
      # trusted.
      - run: node scripts/check-memorandum.mjs
      # SECURITY.md is generated from security.config.json and must not be
      # edited by hand.
      - run: node scripts/check-security.mjs

  # The weekly sequencer uptime feed check (#38) stops silently if GitHub disables its schedule,
  # which it does to a public repository after 60 days without activity, and a disabled workflow
  # runs on no trigger. So the guard lives here, on every push and pull request.
  sequencer-check-alive:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-sequencer-feed.mjs --watchdog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
