name: contracts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
        working-directory: contracts

  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The memorandum states a test count and a deployment status; both are
      # measurable from this repository, so they are measured rather than
      # trusted.
      - run: node scripts/check-memorandum.mjs
      # SECURITY.md is generated from security.config.json and must not be
      # edited by hand.
      - run: node scripts/check-security.mjs
